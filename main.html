<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container-fluid mt-2">
        <h4>Bootstrap Buttons</h4>
        <button type="button" id="button-1" class="btn btn-primary">Button-1</button>
        <button type="button" id="button-2" class="btn btn-outline-secondary">Button-2</button>
        <button type="button" id="button-3" class="btn btn-success btn-lg">Button-3</button>
        <button type="button" id="button-4" class="btn btn-danger btn-sm">Button-4</button>
        <button type="button" id="button-5" class="btn btn-warning btn-lg btn-block w-100 my-2">Button-5</button>
        <button type="button" id="button-6" class="btn btn-info disabled" disabled>Button-6</button>
        <button type="button" id="button-7" class="btn btn-light">Button-7</button>
        <button type="button" id="button-8" class="btn btn-link">Button-8</button>
    </div>
    <script type="text/javascript" src="./script.js"></script>
</body>

</html>
